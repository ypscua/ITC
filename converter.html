
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter | ITC</title>
  <style>
    body {
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }
    main {
      max-width: 550px;
      margin: auto;
    }
    a { color: #a78bfa; }
    h1 { margin-top: 35px; }
    .card {
      background: #20202a;
      padding: 25px;
      border-radius: 15px;
      margin-top: 25px;
    }
    label {
      display: block;
      margin: 15px 0 8px;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input, select {
      background: #30303b;
      color: white;
    }
    button {
      background: #a78bfa;
      color: #101014;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #c4b5fd; }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to Home</a>
    <h1>Unit Converter</h1>
    <p>Convert temperature and length measurements.</p>

    <div class="card">
      <label for="value">Enter a value</label>
      <input type="number" id="value"
             placeholder="Enter a number" step="any">

      <label for="conversion">Conversion Type</label>
      <select id="conversion">
        <option value="cf">Celsius to Fahrenheit</option>
        <option value="fc">Fahrenheit to Celsius</option>
        <option value="mf">Meters to Feet</option>
        <option value="fm">Feet to Meters</option>
      </select>

      <button onclick="convert()">Convert</button>
      <p id="result" aria-live="polite"></p>
    </div>
  </main>

  <script>
    function convert() {
      const input = document.getElementById("value");
      const type = document.getElementById("conversion").value;
      const result = document.getElementById("result");

      if (input.value.trim() === "") {
        result.textContent = "Please enter a value.";
        return;
      }

      const value = Number(input.value);
      if (!Number.isFinite(value)) {
        result.textContent = "Please enter a valid number.";
        return;
      }

      let answer;
      let unit;

      if (type === "cf") {
        answer = (value * 9 / 5) + 32;
        unit = "°F";
      } else if (type === "fc") {
        answer = (value - 32) * 5 / 9;
        unit = "°C";
      } else if (type === "mf") {
        answer = value * 3.28084;
        unit = "ft";
      } else {
        answer = value / 3.28084;
        unit = "m";
      }

      result.textContent =
        "Result: " + answer.toFixed(2) + " " + unit;
    }
  </script>
</body>
</html>
